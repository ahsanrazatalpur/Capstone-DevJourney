<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tag in html</title>
</head>
<body><h1>image tag in html</h1>
    <p>image tag or img tag used to embeded image on webpages , it is semantic tags and
    inline element , it is void tag  or empty tag (non-closing)</p>

    <h4>Example</h4>
    <img title="randomn-images" height="100px" width="100px" src="https://picsum.photos/300" alt="randomn-images">
    <!--
    - alt text show when image cannot run
    - height for give height to image
    - width for give width to image 
    - title for show title when hover 
    -->
</body>
</html>
