<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop down</title>
</head>
<body>
    <h1>Simple Dropdown</h1>
   <select name="city" id="city">
    <option value="badin">Badin</option>
    <option value="Kadhan">Kadhan</option>
    <option value="Luwari Shareef">Luwari Shareef</option>
    <option value="Hyderabad">Hyderabad</option>
    <option value="Karachi">Karachi</option>
   </select>
 <br><br>

 <h1>Multiple Dropdown </h1>
 <select name="games" id="games" multiple>
    <option value="Cricket">Cricket</option>
    <option value="Football">Football</option>
    <option value="Hockeyball">Hockeyball</option>
    <option value="chess">Chess</option>
 </select>

 <br><br>
 <h1>Medentory Choose Dropdown</h1>
 <select name="laptop" id="laptop" required>
    <option value="lenovo">Lenovo</option>
    <option value="thinkpad">Thinkpad</option>
    <option value="panasonic">panasonic</option>
 </select>

<br><br>
<h1>Dropdown With first option disbaled</h1>
<select name="fruits" id="fruits">
    <option value="default" disabled selected>Select Your Favourite Fruit </option>
    <option value="mango">Mango</option>
    <option value="graps">Grapes</option>
    <option value="watermenlon">watermenlon</option>
    <option value="Banana">Banana</option>
</select>


    
</body>
</html>
