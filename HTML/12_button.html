<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<body>
    <h1>Button</h1>
    <p>A button tag is used to create clickable button on webpage</p>

    <h4>syntax</h4>
    <h4>Default or normal button</h4>
    <button>Click Me</button>
    
     <h4>Disable or non-clickable button</h4>
    <button disabled="disabled">Diabled</button>

    <h4>Reset button</h4>
    <button type="reset">Reset</button>
    
    <h4>Submit button</h4>
    <button type="submit">Submit here</button>

</body>
</html>
