<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in html</title>
</head>
<body>
<h1>Form in html</h1>
<p>Form is used to collect information from user and send it to server for processing</p>
<form action="">

    <label for="name">Name</label>
    <input type="text" placeholder="Enter your name here"> 

    <label for="age">Age</label>
    <input type="number" name="age" id="age" placeholder="Enter your age here"> <br><br>

    <label for="phone">Phone</label>
    <input type="tel" name="phone" id="phone" placeholder="Enter your Phone number here">

    <label for="date">Date</label>
    <input type="date" name="date" id="date" placeholder="Enter date here"> <br><br>

    <label for="time">Time</label>
    <input type="time" name="time" id="time" placeholder="Enter time here">

    <label for="color">Favourite Color</label>
    <input type="color" name="color" id="color"> <br><br>

   <p>Your Favourite Hobby :</p>
   <input type="checkbox" name="games" id="games">
   <label for="games"> Play Games</label>
   <input type="checkbox" name="Watch movies" id="movies">
   <label for="movies">Watch Movies</label>
   <input type="checkbox" name="study" id="study">
   <label for="study">Study</label>

   <label for="email">Email : </label>
   <input type="email" name="name" id="name" placeholder="Enter your email"> <br><br>

   <label for="file">Uplaod File here</label>
   <input type="file" name="file" id="file">

   <label for="hidden">Hidden</label> <!--not visible to user but submited to server-->
   <input type="hidden" name="hidden" placeholder="Hidden"> <!--usually user or product id etc-->

   <label for="image">Image</label><br><br>
   <input type="image" src="07_image.html" alt="html image">

   <label for="password">Password</label>
   <input type="password" name="password" id="password" placeholder="Enter your password here">

   <p>Skil : </p>
   <label for="skill">HTML</label>
   <input type="radio" name="skill" id="skill">
   <label for="skill">CSS</label>
   <input type="radio" name="skill" id="skill">
   <label for="skill">JS</label>
   <input type="radio" name="skill" id="skill">

   <label for="range">Skill Speciality level : </label>
   <input type="range" name="range" id="range"> <br><br>

   <label for="search">Search : </label>
   <input type="search" name="search" id="search" placeholder="Search anything here">

   <label for="url">URL : </label>
   <input type="url" name="url" id="url" placeholder="Enter url of your id">




</form>
</body>
</html>
